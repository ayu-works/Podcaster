name: short digest

on:
  workflow_dispatch:
  # Run once when this smoke workflow is first added or deliberately changed.
  # Normal application pushes do not spend Groq tokens automatically.
  push:
    branches: [main]
    paths:
      - ".github/workflows/short-digest.yml"

jobs:
  short-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r block-1-setup/requirements.txt
      - name: Preview a short digest
        run: python block-7-run/run.py --skip-fetch --tag-limit 20 --dry-run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TOKEN: ${{ secrets.DATABASE_TOKEN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-digest-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
