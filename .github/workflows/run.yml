name: digest

on:
  schedule:
    - cron: "30 1 * * 0,1,3,5" # 07:00 IST, Sun/Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without sending or persisting tags"
        type: boolean
        default: true
      tag_limit:
        description: "Newest episodes to tag (0 = full production queue)"
        type: number
        default: 0
      recipient:
        description: "Optional exact active subscriber for a manual test"
        type: string
        default: ""

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r block-1-setup/requirements.txt
      - name: Run digest
        run: |
          args=()
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$INPUT_TAG_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
            args+=(--tag-limit "$INPUT_TAG_LIMIT")
          fi
          if [[ -n "$INPUT_RECIPIENT" ]]; then
            args+=(--email "$INPUT_RECIPIENT")
          fi
          python block-7-run/run.py "${args[@]}"
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG_LIMIT: ${{ inputs.tag_limit }}
          INPUT_RECIPIENT: ${{ inputs.recipient }}
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TOKEN: ${{ secrets.DATABASE_TOKEN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
