name: digest

on:
  schedule:
    - cron: "30 1 * * 0,1,3,5" # 07:00 IST, Sun/Mon/Wed/Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without sending or persisting tags"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r block-1-setup/requirements.txt
      - name: Run digest
        run: python block-7-run/run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          PODCASTINDEX_KEY: ${{ secrets.PODCASTINDEX_KEY }}
          PODCASTINDEX_SECRET: ${{ secrets.PODCASTINDEX_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TOKEN: ${{ secrets.DATABASE_TOKEN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
