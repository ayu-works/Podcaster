{#
  The digest email.

  Every style is inline: Gmail strips <style> blocks entirely, so a stylesheet
  would render as unstyled text in the client most people read this in. Tables,
  not divs, because Outlook's renderer is Word's. No external images — they are
  blocked by default, and a layout that depends on them arrives broken.

  Gmail clips messages over 102KB and hides the rest behind "View entire
  message". Two picks is nowhere near that; keep it that way.
#}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="background-color:#f5f3f0;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:28px 12px 40px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
             style="width:100%;max-width:600px;background-color:#ffffff;
                    border-radius:14px;overflow:hidden;">

        <!-- header -->
        <tr>
          <td style="padding:30px 30px 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;
                      text-transform:uppercase;color:#ff8a4c;">Podcaster</p>
            <p style="margin:14px 0 0;font-size:22px;line-height:1.3;font-weight:600;
                      color:#17151a;letter-spacing:-.02em;">
              {% if picks|length == 1 %}One episode worth your time{% else %}{{ picks|length }} episodes worth your time{% endif %}
            </p>
            <p style="margin:8px 0 0;font-size:14px;color:#8b8794;">
              {{ sent_on }} &middot; picked from {{ scanned }} new episode{{ '' if scanned == 1 else 's' }}
              across {{ shows }} shows
            </p>
          </td>
        </tr>

        {% for pick in picks %}
        {% set episode = pick.episode %}
        <tr>
          <td style="padding:26px 30px 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                   style="border-top:1px solid #e8e4df;">
              <tr>
                <td style="padding-top:24px;">

                  <p style="margin:0;font-size:13px;font-weight:600;color:#ff8a4c;">
                    {{ episode.show_name }}
                  </p>

                  <p style="margin:7px 0 0;font-size:19px;line-height:1.35;font-weight:600;
                            color:#17151a;letter-spacing:-.01em;">
                    {% if episode.web_url %}
                      <a href="{{ episode.web_url }}"
                         style="color:#17151a;text-decoration:none;">{{ episode.title }}</a>
                    {% else %}{{ episode.title }}{% endif %}
                  </p>

                  <p style="margin:8px 0 0;font-size:13px;color:#8b8794;">
                    {{ pick.duration }}{% if pick.published %} &middot; {{ pick.published }}{% endif %}
                  </p>

                  <!-- the why-this line. The only part that is not metadata,
                       and the only reason to trust the rest. -->
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                    <tr>
                      <td style="padding:14px 0 0;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                               style="background-color:#faf7f4;border-left:3px solid #ff8a4c;
                                      border-radius:0 8px 8px 0;">
                          <tr>
                            <td style="padding:13px 16px;font-size:15px;line-height:1.55;color:#4a4552;">
                              {{ pick.reason }}
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>

                  {% if episode.web_url %}
                  <p style="margin:16px 0 0;">
                    <a href="{{ episode.web_url }}"
                       style="display:inline-block;padding:11px 22px;background-color:#17151a;
                              color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;
                              border-radius:999px;">Listen &rarr;</a>
                  </p>
                  {% endif %}

                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endfor %}

        <!-- footer -->
        <tr>
          <td style="padding:30px 30px 30px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                   style="border-top:1px solid #e8e4df;">
              <tr>
                <td style="padding-top:20px;font-size:12.5px;line-height:1.6;color:#a5a1ac;">
                  Two picks at most, four mornings a week. Nothing worth sending means
                  nothing gets sent.
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
