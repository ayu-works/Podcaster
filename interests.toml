# Your interests. `text` goes into the ranking prompt word for word.
# Groq generates focused catalogue search terms from each `text`. The terms
# below are optional fallbacks used only with `--use-file-terms`.
#
# Sharpen the `text` lines whenever your interests change; they are the actual
# signal used by both search expansion and ranking.

[[interest]]
text = "Cooking — technique, recipes, and the science of why food works"
terms = [
  "cooking",
  "food",
  "recipes",
  "home cooking",
  "chef",
  "baking",
  "food science",
  "culinary",
  "meal prep",
  "cookbook",
  "restaurant",
  "food writing",
]
# dropped: "kitchen" (pickleball, WordPress), "eating" (baseball, endurance)

[[interest]]
